<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- CORRECTED: Working CDN link for the QR library -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="grid">
        <h2>QR Code Generator</h2>
        
        <!-- Standard HTML5 Canvas - Will never show a broken image link icon -->
        <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <canvas id="qr-canvas"></canvas>
        </div>

        <select id="size">
            <option value="100">100x100</option>
            <option value="150">150x150</option>
            <option value="200">200x200</option>
            <option value="250" selected>250x250</option>
            <option value="300">300x300</option>
        </select>
        <br><br>

        <textarea placeholder="Enter Your Text" id="qrtext"></textarea>
        <br><br>

        <button type="button" onclick="genQR()">Generate</button>
        
        <p>Developed By Ossysamson Innovations</p>
    </div>

    <script type="text/javascript">
        // 1. Initialize the QR generator targeted directly at the canvas element
        const qr = new QRious({
            element: document.getElementById('qr-canvas'),
            size: 250,
            value: 'Ossysamson Innovations', // Default initial text
            level: 'H' // High error correction
        });

        // 2. Handle dynamic updates cleanly when the button is clicked
        function genQR() {
            const mytext = document.getElementById("qrtext").value.trim();
            const mysize = parseInt(document.getElementById("size").value);

            if (mytext === "") {
                alert("Please Enter Text");
                return;
            }

            // Directly modify the generator properties (automatically re-renders the canvas)
            qr.size = mysize;
            qr.value = mytext;
        }
    </script>
</body>
</html>
