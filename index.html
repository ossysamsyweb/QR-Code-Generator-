<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- QR Code JavaScript Library -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="grid" style="max-width: 400px; margin: 0 auto; text-align: center;">
        <h2>QR Code Generator</h2>
        
        <!-- Container where the QR code will be generated -->
        <div id="qrcode-container" style="display: flex; justify-content: center; margin-bottom: 20px;"></div>

        <select id="size">
            <option value="100">100x100</option>
            <option value="150">150x150</option>
            <option value="200">200x200</option>
            <option value="250" selected>250x250</option>
            <option value="300">300x300</option>
        </select>
        <br><br>

        <textarea placeholder="Enter Your Text" id="qrtext"></textarea>
        <br><br>

        <button type="button" onclick="genQR()">Generate</button>
        
        <p>Developed By Ossysamson Innovations</p>
    </div>

    <script type="text/javascript">
        // Initialize the QR code instance once
        const qrcodeContainer = document.getElementById("qrcode-container");
        const qrcode = new QRCode(qrcodeContainer, {
            text: "Welcome",
            width: 250,
            height: 250,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        function genQR() {
            const mytext = document.getElementById("qrtext").value.trim();
            const mysize = parseInt(document.getElementById("size").value);

            if (mytext === "") {
                alert("Please Enter Text");
                return;
            }

            // Clear the previous QR code canvas/image elements inside the container
            qrcode.clear(); 
            
            // Reconfigure the size dynamically
            qrcode._htOption.width = mysize;
            qrcode._htOption.height = mysize;
            
            // Generate the new QR code
            qrcode.makeCode(mytext);
        }
    </script>
</body>
</html>
